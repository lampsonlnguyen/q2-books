name: Publish CrossPoint Core Beta Dev Build

on:
  push:
    branches: [main, books-renderer-linux-link]
    paths:
      - "crosspoint-core/BETA_VERSION"

permissions:
  contents: write

concurrency:
  group: crosspoint-core-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, package and publish core development release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate beta version and source revision
        run: |
          set -euo pipefail
          version="$(cat crosspoint-core/BETA_VERSION)"
          if [[ ! "$version" =~ ^core-v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "Invalid beta version: $version" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$version" >> "$GITHUB_ENV"

      - name: Install host XML dependency
        run: sudo apt-get update && sudo apt-get install -y libexpat1-dev zlib1g-dev

      - name: Configure
        run: cmake -S crosspoint-core -B build/crosspoint-core -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build/crosspoint-core --parallel 2

      - name: Test
        run: ctest --test-dir build/crosspoint-core --output-on-failure

      - name: Package tagged source and tested host components
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          folder="books-${RELEASE_TAG}-core-devkit"
          mkdir -p "dist/$folder/lib" "dist/$folder/platform"
          cp build/crosspoint-core/libcrosspoint_utf8.a build/crosspoint-core/libcrosspoint_txt.a build/crosspoint-core/libcrosspoint_epub_container.a build/crosspoint-core/libcrosspoint_zip.a build/crosspoint-core/libcrosspoint_opf.a build/crosspoint-core/libcrosspoint_book_cache.a build/crosspoint-core/libbooks_q2_input.a build/crosspoint-core/libbooks_q2_framebuffer.a build/crosspoint-core/libcrosspoint_layout_foundation.a build/crosspoint-core/libcrosspoint_font_metrics.a build/crosspoint-core/libcrosspoint_linebreak.a "dist/$folder/lib/"
          cp crosspoint-core/platform/q2/Q2Controls.hpp crosspoint-core/platform/q2/Q2Display.hpp crosspoint-core/platform/q2/Q2BookHandoff.hpp crosspoint-core/platform/q2/Q2SocketInput.hpp crosspoint-core/platform/q2/Q2Framebuffer.hpp crosspoint-core/platform/q2/Q2PagePresenter.hpp "dist/$folder/platform/"
          cp -R crosspoint-core/lib crosspoint-core/tests crosspoint-core/platform/posix "dist/$folder/"
          cp crosspoint-core/CMakeLists.txt crosspoint-core/README.md "dist/$folder/"
          cp -R crosspoint-core/tools crosspoint-core/licenses "dist/$folder/"
          mkdir -p "dist/$folder/docs"
          cp docs/epub-page-preview-testing.md "dist/$folder/docs/"
          cp build/crosspoint-core/libcrosspoint_hyphenation.a "dist/$folder/lib/"
          cp crosspoint-core/LICENSE-CROSSPOINT crosspoint-core/LICENSE-BORROWED-CODE "dist/$folder/"
          cp build/crosspoint-core/books-epub-check build/crosspoint-core/crosspoint_renderer_link_tests build/crosspoint-core/books_epub_page_preview "dist/$folder/"
          python3 crosspoint-core/tools/pgm_to_png.py build/crosspoint-core/books-epub-preview.pgm "dist/books-${RELEASE_TAG}-epub-preview.png"
          cp build/crosspoint-core/books-epub-preview.pgm "dist/$folder/"
          cp "dist/books-${RELEASE_TAG}-epub-preview.png" "dist/$folder/"
          (cd dist && sha256sum "books-${RELEASE_TAG}-epub-preview.png" > "books-${RELEASE_TAG}-epub-preview.png.sha256")
          cat > "dist/$folder/NOT-FLASHABLE.txt" <<'NOTICE'
          Books core v0.2.0 beta — native host development preview.
          Contains tested Linux x86_64 host static libraries, original renderer,
          EPUB page preview test programs, source code and Q2 adapter headers.
          This is NOT a Shanling Q2 app, NOT a MIPS executable, and NOT installable on Q2.
          The upstream EPUB rendering and Linux HAL integration remain under development.
          No ESP32 bootloader, firmware image, FreeRTOS binary, or e-ink driver is included.
          NOTICE
          (
            cd dist
            zip -qr "$folder.zip" "$folder"
            sha256sum "$folder.zip" > "$folder.zip.sha256"
          )
          cat > dist/RELEASE_NOTES.md <<'NOTES'
          ## Books core v0.2.0-beta.1 — development preview

          **NOT INSTALLABLE ON THE SHANLING Q2.** Host-only Linux x86_64
          development release; not a firmware update or MIPS reader.

          ### Improvements over v0.1.0
          - Original CrossPoint ZIP, OPF/spine and CSS parser primitives.
          - Original GfxRenderer and compressed font rasterization.
          - Original OpenType shaping, ParsedText/TextBlock layout and
            multilingual Liang hyphenation (11 languages).
          - Reproducible 375x320 PNG and PGM text-page output from a real
            EPUB fixture, plus original renderer/EPUB host test executables.
          - GCC and Clang CI: all 21 regression tests passed.

          ### Known limitations
          - Preview uses a test-only XHTML paragraph extractor rather than
            the complete ChapterHtmlSlimParser/CSS/image engine.
          - Current sample font lacks coverage for CJK, Arabic and Hebrew:
            characters can render as replacement glyphs.
          - No working Q2 MIPS reader, touchscreen or click-wheel integration
            in a complete EPUB app; no physical Q2 testing yet.
          - Full Section/Page/image pipeline not finished.

          See docs/epub-page-preview-testing.md and draft PR #15.
          NOTES

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/books-*.zip dist/books-*.zip.sha256 dist/books-*.png dist/books-*.png.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Books $RELEASE_TAG (CrossPoint Core Dev Build)" \
            --notes-file dist/RELEASE_NOTES.md
