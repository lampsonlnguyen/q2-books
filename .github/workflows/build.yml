name: CrossPoint Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crosspoint-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (GCC and Clang)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install host XML dependency
        run: sudo apt-get update && sudo apt-get install -y libexpat1-dev

      - name: Configure CrossPoint core
        run: cmake -S crosspoint-core -B build/crosspoint-core -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build/crosspoint-core --parallel 2

      - name: Test
        run: ctest --test-dir build/crosspoint-core --output-on-failure

      - name: Package tested host components
        if: matrix.compiler == 'gcc'
        run: |
          set -euo pipefail
          mkdir -p dist/core-devkit/lib dist/core-devkit/include dist/core-devkit/platform
          cp build/crosspoint-core/libcrosspoint_utf8.a build/crosspoint-core/libcrosspoint_txt.a build/crosspoint-core/libcrosspoint_epub_container.a dist/core-devkit/lib/
          cp crosspoint-core/lib/Utf8/Utf8.h crosspoint-core/lib/Txt/TxtToHtml.h crosspoint-core/lib/Epub/parsers/ContainerParser.h dist/core-devkit/include/
          cp crosspoint-core/platform/q2/Q2Controls.hpp crosspoint-core/platform/q2/Q2Display.hpp crosspoint-core/platform/q2/Q2BookHandoff.hpp dist/core-devkit/platform/
          cp crosspoint-core/LICENSE-CROSSPOINT dist/core-devkit/
          printf '%s\n' 'DEVELOPMENT CORE ONLY — Linux x86_64 host static libraries, NOT Q2 firmware.' > dist/core-devkit/NOT-FLASHABLE.txt
          cd dist
          zip -qr crosspod-crosspoint-core-devkit.zip core-devkit

      - name: Upload development build
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: crosspod-crosspoint-core-devkit-${{ github.sha }}
          path: dist/crosspod-crosspoint-core-devkit.zip
          if-no-files-found: error
          retention-days: 30
