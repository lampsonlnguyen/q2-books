name: CrossPoint Core Port Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crosspoint-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build unchanged upstream CrossPoint Unicode code and Q2 platform adapters
        run: |
          cmake -S crosspoint-core -B build/crosspoint-core -DCMAKE_BUILD_TYPE=Release
          cmake --build build/crosspoint-core --parallel 2
          ctest --test-dir build/crosspoint-core --output-on-failure
