name: Clean merged lazy indexing branch
on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup-lazy-index.yml"]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete the merged and verified development branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch=v0.5.0-lazy-metadata-index
          expected=7279a3b67a0310f0d428efdcba3867de448b0a25
          merged=6dad39c07b7e5b4721b612cf74657508461e62ec
          actual="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')"
          test "$actual" = "$expected"
          test "$(gh api "repos/$GH_REPO/pulls/27" --jq '.merged')" = true
          test "$(gh api "repos/$GH_REPO/pulls/27" --jq '.merge_commit_sha')" = "$merged"
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch"
