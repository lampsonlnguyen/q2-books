name: Clean merged language-visibility feature branch
on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup-multilingual-visibility.yml"]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only verified merged language-test branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch=feature/multilingual-visibility-epub
          expected=c45ccfc3270e048797dac0eac62ef621278edeeb
          merge=ab61bc2e6f4004a3c29fe0954413c6ca7a66c4d9
          test "$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')" = "$expected"
          test "$(gh api "repos/$GH_REPO/pulls/26" --jq '.merged')" = true
          test "$(gh api "repos/$GH_REPO/pulls/26" --jq '.merge_commit_sha')" = "$merge"
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch"
