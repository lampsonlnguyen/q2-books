name: Clean merged blank-text fix branch
on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup-reader-text-fix.yml"]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the tested and merged branch tip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/reader-blank-text-long-scroll
          head=da3efb07e2f6250f3da4a03643373afd65f04860
          merge=97eaf16855b22813d8abc79580e659890388f64b
          actual="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')"
          test "$actual" = "$head"
          test "$(gh api "repos/$GH_REPO/pulls/24" --jq '.merged')" = true
          test "$(gh api "repos/$GH_REPO/pulls/24" --jq '.merge_commit_sha')" = "$merge"
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch"
