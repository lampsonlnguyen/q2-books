name: Clean merged v0.5.0 search branch
on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup-search-branch.yml"]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove only verified merged branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch=v0.5.0-library-search-folders
          expected=3b47e5d438f11797cbba493141692d85f1c051ed
          merged=fae858bb372c491b399f1dcdb8403a8abc5b52ca
          test "$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')" = "$expected"
          test "$(gh api "repos/$GH_REPO/pulls/25" --jq '.merged')" = true
          test "$(gh api "repos/$GH_REPO/pulls/25" --jq '.merge_commit_sha')" = "$merged"
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch"
