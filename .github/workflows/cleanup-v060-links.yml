name: Cleanup merged advanced reading branch
on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup-v060-links.yml"]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Remove verified merged branch only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch=v0.6.0-links-footnotes
          expected=9ce62538fad3c903873efee3bf6284b1d04aeb87
          merged=51bd88874ffea3c0f13e8d75a534cf73284ceac5
          test "$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')" = "$expected"
          test "$(gh api "repos/$GH_REPO/pulls/28" --jq '.merged')" = true
          test "$(gh api "repos/$GH_REPO/pulls/28" --jq '.merge_commit_sha')" = "$merged"
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch"
