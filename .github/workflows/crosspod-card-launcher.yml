name: CrossPod card launcher diagnostics CI
on:
  push:
    branches: [crosspod-renderer-linux-link]
    paths:
      - "crosspoint-core/platform/q2/crosspod-launcher.sh"
      - "crosspoint-core/tests/card_launcher_test.py"
      - ".github/workflows/crosspod-card-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  card-launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and execution semantics
        run: |
          set -euo pipefail
          /bin/sh -n crosspoint-core/platform/q2/crosspod-launcher.sh
          python3 crosspoint-core/tests/card_launcher_test.py \
            crosspoint-core/platform/q2/crosspod-launcher.sh
      - name: Enforce Q2 Pod game-card entrypoint and manifest
        run: |
          set -euo pipefail
          grep -F 'ROOT=${CROSSPOD_APP_DIR:-/mnt/mmc/.crosspod}' \
            crosspoint-core/platform/q2/crosspod-launcher.sh
          grep -F 'BIN="$ROOT/crosspod-engine"' \
            crosspoint-core/platform/q2/crosspod-launcher.sh
          grep -F 'exec "$BIN"' \
            crosspoint-core/platform/q2/crosspod-launcher.sh
