name: Publish verified CrossPod v0.6.0 beta
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-crosspod-v060.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: crosspod-v060-beta-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove release source equals successful GCC Clang and MIPS builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tested=24be782986d9601272be6bf113bb6b9e8f30aeb5
          merged=25a3b8ccb5a01db442cd305c598ded0e8ae4ddee
          test "$(git rev-parse HEAD^)" = "$merged"
          test "$(git rev-parse "$tested^{tree}")" = "$(git rev-parse "$merged^{tree}")"
          git merge-base --is-ancestor "$tested" "$merged"
          for id in 44937774555 44937778766; do
            test "$(gh api "repos/$GH_REPO/actions/runs/$id" --jq '.head_sha')" = "$tested"
            test "$(gh api "repos/$GH_REPO/actions/runs/$id" --jq '.conclusion')" = success
          done
      - name: Download and verify exact Q2 MIPS card package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          gh run download 44937774555 -R "$GH_REPO" \
            -n crosspod-q2-reader-alpha -D dist/release
          cd dist/release
          sha256sum -c crosspod-q2-reader-alpha.zip.sha256
          unzip -t crosspod-q2-reader-alpha.zip > /dev/null
          for item in \
            .crosspod/crosspod-engine \
            .crosspod/q2-crosspod \
            .crosspod/dictionary-starter.tsv \
            Books/CrossPod-Multilingual-Visibility-Test.epub \
            Books/CrossPod-Links-and-Footnotes-Test.epub; do
            unzip -Z1 crosspod-q2-reader-alpha.zip | grep -Fx "$item"
          done
          mv crosspod-q2-reader-alpha.zip crosspod-q2-reader-v0.6.0-beta.zip
          sha256sum crosspod-q2-reader-v0.6.0-beta.zip > \
            crosspod-q2-reader-v0.6.0-beta.zip.sha256
      - name: Publish GitHub release as beta prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v0.6.0
          merge=25a3b8ccb5a01db442cd305c598ded0e8ae4ddee
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            test "$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')" = "$merge"
          else
            gh api -X POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$merge" >/dev/null
          fi
          if gh release view "$tag" -R "$GH_REPO" >/dev/null 2>&1; then
            echo "::error::v0.6.0 already released; refusing to replace assets."
            exit 1
          fi
          gh release create "$tag" \
            dist/release/crosspod-q2-reader-v0.6.0-beta.zip \
            dist/release/crosspod-q2-reader-v0.6.0-beta.zip.sha256 \
            -R "$GH_REPO" --verify-tag --prerelease \
            --title "CrossPod v0.6.0 Beta — Advanced Reading for Shanling Q2" \
            --notes-file docs/v0.6.0-completion.md
      - name: Remove fully merged development branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch=v0.6.0-selection-highlights-dictionary
          head=24be782986d9601272be6bf113bb6b9e8f30aeb5
          merge=25a3b8ccb5a01db442cd305c598ded0e8ae4ddee
          test "$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')" = "$head"
          test "$(gh api "repos/$GH_REPO/pulls/29" --jq '.merged')" = true
          test "$(gh api "repos/$GH_REPO/pulls/29" --jq '.merge_commit_sha')" = "$merge"
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch"
