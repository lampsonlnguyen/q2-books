name: Publish verified CrossPod v0.7.0 beta
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-crosspod-v070.yml"
permissions:
  contents: write
  actions: read
concurrency:
  group: crosspod-v070-beta-release
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify full source is the tested feature implementation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          q2=6ba630f209784c548cea00da758225f3b9e46905
          host=5ab1782b963fe6a80f5207dc466cbf611a631645
          merged=cc5e93aa4f42abfc7d09086e3600a794c974bae2
          git merge-base --is-ancestor "$merged" HEAD
          test "$(git diff --name-only "$merged" HEAD)" = ".github/workflows/publish-crosspod-v070.yml"
          test "$(git rev-parse "$host^{tree}")" = "$(git rev-parse "$merged^{tree}")"
          test "$(git diff --name-only "$q2" "$host")" = "docs/v0.7.0-connected-library.md"
          test "$(gh api "repos/$GH_REPO/actions/runs/44944019381" --jq '.head_sha')" = "$q2"
          test "$(gh api "repos/$GH_REPO/actions/runs/44944019381" --jq '.conclusion')" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/44944145340" --jq '.head_sha')" = "$host"
          test "$(gh api "repos/$GH_REPO/actions/runs/44944145340" --jq '.conclusion')" = success
      - name: Download exact Q2 MIPS tested application ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          gh run download 44944019381 -R "$GH_REPO" \
            -n crosspod-q2-reader-alpha -D dist/release
          cd dist/release
          expected="$(awk 'NR==1 {print $1}' crosspod-q2-reader-alpha.zip.sha256)"
          echo "$expected  crosspod-q2-reader-alpha.zip" | sha256sum -c -
          unzip -t crosspod-q2-reader-alpha.zip > /dev/null
          for item in \
            .crosspod/crosspod-engine \
            .crosspod/q2-crosspod \
            .crosspod/connected.conf.example \
            .crosspod/dictionary-starter.tsv \
            Books/CrossPod-Multilingual-Visibility-Test.epub \
            Books/CrossPod-Links-and-Footnotes-Test.epub; do
            unzip -Z1 crosspod-q2-reader-alpha.zip | grep -Fx "$item"
          done
          mv crosspod-q2-reader-alpha.zip crosspod-q2-reader-v0.7.0-beta.zip
          sha256sum crosspod-q2-reader-v0.7.0-beta.zip > \
            crosspod-q2-reader-v0.7.0-beta.zip.sha256
      - name: Publish v0.7.0 beta release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v0.7.0
          merged=cc5e93aa4f42abfc7d09086e3600a794c974bae2
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            test "$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')" = "$merged"
          else
            gh api -X POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$merged" >/dev/null
          fi
          if gh release view "$tag" -R "$GH_REPO" >/dev/null 2>&1; then
            echo "::error::Existing v0.7.0 release; will not overwrite."
            exit 1
          fi
          gh release create "$tag" \
            dist/release/crosspod-q2-reader-v0.7.0-beta.zip \
            dist/release/crosspod-q2-reader-v0.7.0-beta.zip.sha256 \
            -R "$GH_REPO" --verify-tag --prerelease \
            --title "CrossPod v0.7.0 Beta — Kavita, OPDS and Reading Sync" \
            --notes-file docs/v0.7.0-connected-library.md
      - name: Remove merged feature branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch=v0.7.0-connected-library
          expected=5ab1782b963fe6a80f5207dc466cbf611a631645
          merged=cc5e93aa4f42abfc7d09086e3600a794c974bae2
          test "$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')" = "$expected"
          test "$(gh api "repos/$GH_REPO/pulls/30" --jq '.merged')" = true
          test "$(gh api "repos/$GH_REPO/pulls/30" --jq '.merge_commit_sha')" = "$merged"
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch"
