name: CrossPod Q2 v0.8.0 beta build and release
on:
  workflow_dispatch:
  push:
    branches: [main, v0.9-https-transport]
    paths:
      - "crosspoint-core/tools/build_q2_github.sh"
      - ".github/workflows/q2-reader-card.yml"
      - "crosspoint-core/reader/**"
      - "crosspoint-core/tests/**"
      - "crosspoint-core/platform/q2/**"
      - "crosspoint-core/platform/posix/**"
      - "crosspoint-core/lib/Epub/**"
      - "crosspoint-core/CMakeLists.txt"
# Each new patch supersedes the previous alpha; avoid running multiple
# expensive Q2 toolchain/font downloads for obsolete commits.
concurrency:
  group: crosspod-q2-reader-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
jobs:
  host-tests:
    name: Host GCC and Clang tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Install EPUB dependencies
        run: sudo apt-get update && sudo apt-get install -y libexpat1-dev zlib1g-dev libjpeg-dev
      - name: Configure
        run: cmake -S crosspoint-core -B build/core-host -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build/core-host --parallel 2
      - name: Run full host regression suite
        run: ctest --test-dir build/core-host --output-on-failure

  build-q2-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Q2 cross-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm cmake git curl zip unzip \
            squashfs-tools qemu-user binutils-mipsel-linux-gnu \
            gcc-mipsel-linux-gnu g++-mipsel-linux-gnu \
            libc6-dev-mipsel-cross
      - name: Provision Q2 runtime, link reader, validate and package
        shell: bash
        run: bash crosspoint-core/tools/build_q2_github.sh
      - name: Upload Q2 alpha card ZIP
        uses: actions/upload-artifact@v4
        with:
          name: crosspod-q2-reader-alpha
          path: |
            dist/crosspod-q2-reader-alpha.zip
            dist/crosspod-q2-reader-alpha.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crosspod-q2-reader-build-logs
          path: |
            build/q2-device/reader/CMakeFiles/CMakeConfigureLog.yaml
            build/q2-device/reader/CMakeFiles/CMakeError.log
            build/q2-device/reader/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
          retention-days: 7
  publish-v0-8-beta:
    name: Publish v0.8.0 beta from verified MIPS package
    needs: [host-tests, build-q2-reader]
    if: github.ref == 'refs/heads/main' && github.sha == '8f82f195c462de770a5676d52e4688cf93deccdc'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: crosspod-q2-reader-alpha
          path: dist
      - name: Verify package and prepare versioned beta artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/crosspod-q2-reader-alpha.zip
          expected=$(awk 'NR==1 {print $1}' dist/crosspod-q2-reader-alpha.zip.sha256)
          actual=$(sha256sum dist/crosspod-q2-reader-alpha.zip | cut -d ' ' -f1)
          test -n "$expected" && test "$expected" = "$actual"
          unzip -t dist/crosspod-q2-reader-alpha.zip
          unzip -Z1 dist/crosspod-q2-reader-alpha.zip | grep -Fxq '.crosspod/crosspod-engine'
          unzip -Z1 dist/crosspod-q2-reader-alpha.zip | grep -Fxq '.crosspod/q2-crosspod'
          cp dist/crosspod-q2-reader-alpha.zip dist/crosspod-q2-v0.8.0-beta.zip
          (cd dist && sha256sum crosspod-q2-v0.8.0-beta.zip > crosspod-q2-v0.8.0-beta.zip.sha256)
          (cd dist && sha256sum -c crosspod-q2-v0.8.0-beta.zip.sha256)
      - name: Publish immutable beta tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.8.0-beta >/dev/null 2>&1; then
            echo "::error::v0.8.0-beta already exists; refusing to overwrite a published beta"
            exit 1
          fi
          gh release create v0.8.0-beta \
            dist/crosspod-q2-v0.8.0-beta.zip \
            dist/crosspod-q2-v0.8.0-beta.zip.sha256 \
            --target "$TARGET_COMMIT" \
            --title "CrossPod v0.8.0 beta (Shanling Q2)" \
            --prerelease \
            --notes "Q2 MIPS/Linux CrossPoint EPUB reader beta. Built from commit $TARGET_COMMIT after GCC/Clang CTest and Q2 MIPS/QEMU checks. Extract the ZIP to the SD-card root; do not flash this as firmware. Includes EPUB reader, multilingual fonts, OPDS/Kavita trusted-LAN HTTP and KOReader-compatible manual sync, wheel sensitivity integration, and power-safe app exit. Physical Q2 suspend, USB/SD, battery and touchscreen validation remains pending. HTTPS is NOT supported; never expose credentials over an untrusted network."
